name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - name: system tools the API calls (as in the Dockerfile)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg poppler-utils || sudo apt-get install -y -qq ffmpeg poppler-utils
      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: sync deps
        # the CPU voices and the MCP server are part of the product and of the tests;
        # the GPU extra (torch, qwen-tts) is not installed here and its tests skip.
        # Without extras every run since #313 failed on 'No module named mcp/numpy'.
        run: uv sync --frozen --extra tts-kokoro --extra tts-piper --extra mcp
      - name: ruff
        run: uv run ruff check src
      - name: pytest
        run: uv run pytest -q

  web:
    name: web check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: svelte-check
        run: npx svelte-check
      - name: build
        run: npm run build