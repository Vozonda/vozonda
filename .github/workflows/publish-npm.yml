name: publish-npm

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  npm-publish:
    name: Publish the npm package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mandatory for npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish unless this version is already there
        working-directory: packages/npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "vozonda@$version" version 2>/dev/null)" = "$version" ]; then
            echo "vozonda@$version is already on npm"
            exit 0
          fi
          npm publish --access public
