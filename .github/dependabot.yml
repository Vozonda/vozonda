# Weekly dependency updates, grouped so each ecosystem opens at most one PR
# for minor and patch bumps. Major bumps arrive as separate PRs.
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      api-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web-minor:
        update-types: [minor, patch]
      # vite and its Svelte plugin only resolve as a pair (peer ranges), so their majors come in one PR
      vite-major:
        patterns: ["vite", "@sveltejs/vite-plugin-svelte"]
        update-types: [major]
    ignore:
      # svelte-check does not accept TypeScript 7 yet (peer range); lift this once it does
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
