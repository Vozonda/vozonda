[project]
name = "vozonda"
version = "0.8.0"
description = "Vozonda orchestrator: url to two-voice podcast dialogue"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vozonda", email = "vozonda@proton.me" }]
keywords = ["podcast", "audio", "tts", "ai", "rss", "voice", "overview", "private", "sovereign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "readability-lxml>=0.8.4.1",
    "lxml_html_clean>=0.4",
    "coincurve>=21.0.0",
    "pillow>=10",
]

[project.optional-dependencies]
tts-qwen = [
    "torch>=2.2.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "qwen-tts>=0.1.0",
]
tts-piper = [
    "piper-tts>=1.2.0",
]
tts-kokoro = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
]
# speech to text for audio sources (tray: audio files and podcast episodes)
stt = [
    "faster-whisper>=1.1",
    # faster-whisper 1.2.1 calls av.open(metadata_errors=...), which PyAV 19 removed
    "av>=11,<19",
]
tts = ["vozonda[tts-qwen]", "vozonda[tts-piper]", "vozonda[tts-kokoro]", "vozonda[stt]"]
mcp = [
    "mcp>=1.9",
]

[tool.uv]
package = true
# qwen-tts requires gradio only for its demo UI (qwen_tts/cli/demo.py), which Vozonda never
# imports; gradio caps pillow below 13, which kept ~40 pillow CVEs open (2026-10-25). Dropped.
override-dependencies = ["gradio; sys_platform == 'never'"]
# Resolve only for real platforms, so the lock keeps no "never" branch with an old gradio in it.
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'", "sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vozonda_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*starlette\\.testclient.*",
    "ignore:.*httpx.*",
    "ignore::DeprecationWarning",
]

[project.urls]
Homepage = "https://vozonda.com"
Repository = "https://github.com/Vozonda/vozonda"
Documentation = "https://github.com/Vozonda/vozonda#readme"
"Bug Tracker" = "https://github.com/Vozonda/vozonda/issues"
Changelog = "https://github.com/Vozonda/vozonda/blob/main/CHANGELOG.md"

[project.scripts]
vozonda = "vozonda_api.main:serve"
vozonda-api = "vozonda_api.main:serve"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "S112", "S110"]
